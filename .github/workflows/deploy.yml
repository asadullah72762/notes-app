name: Notes App CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:

  test-backend:
    name: Backend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install backend
        run: npm install
        working-directory: ./backend
      - name: Check backend
        run: node -e "console.log('Backend theek hai!')"
        working-directory: ./backend

  test-frontend:
    name: Frontend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install frontend
        run: npm install
        working-directory: ./frontend
      - name: Build frontend
        run: npm run build
        working-directory: ./frontend

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2
      - run: docker build ./backend -t notes-app-backend
      - run: docker build ./frontend -t notes-app-frontend
      - run: echo "Sab build ho gaya!"
